<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESG · Excel a JSON</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>body{font-family:Arial,sans-serif;background:#C8B49A;color:#3D2010;margin:0;padding:30px}.box{max-width:760px;margin:auto;background:#F8F4EC;padding:28px;border-radius:24px;box-shadow:0 20px 60px #3d201033}h1{font-family:Georgia,serif;font-size:40px;font-weight:400}input{display:block;width:100%;padding:14px;border:1px solid #A0622A;border-radius:12px;background:#fff;margin:18px 0}button{padding:13px 20px;border:0;border-radius:999px;background:#3D2010;color:#fff;margin:6px;cursor:pointer}.note{background:#EFE6D8;padding:15px;border-left:3px solid #C9A646;line-height:1.6}.ok{font-weight:bold;color:#386641}</style></head><body><div class="box"><h1>Actualizar JSON desde Excel</h1><p class="note">Selecciona el Excel Maestro de ESG Experience. Esta herramienta generará <strong>esg-config.json</strong> y <strong>formulario.json</strong>. Reemplaza esos dos archivos dentro de la carpeta <code>data</code> del portal y vuelve a publicar.</p><input id="file" type="file" accept=".xlsx"><button id="convert">Generar JSON</button><div id="status"></div></div><script>
const $=s=>document.querySelector(s);let workbook;
$('#file').onchange=async e=>{const b=await e.target.files[0].arrayBuffer();workbook=XLSX.read(b,{type:'array'});$('#status').innerHTML='<p class="ok">Excel cargado correctamente.</p>'};
function parse(v){if(typeof v==='number'||typeof v==='boolean')return v;const s=String(v??'').trim();if(/^sí$/i.test(s))return true;if(/^no$/i.test(s))return false;if(s!==''&&!isNaN(s)&&String(Number(s))===s)return Number(s);return s}
function setPath(obj,path,value){const parts=path.split('.');let cur=obj;parts.forEach((p,i)=>{if(i===parts.length-1)cur[p]=value;else cur=cur[p]??={}})}
function download(name,obj){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('#convert').onclick=()=>{if(!workbook)return alert('Selecciona el Excel maestro.');const cfgRows=XLSX.utils.sheet_to_json(workbook.Sheets['ESG_CONFIG'],{range:3,defval:''});const raw={};cfgRows.forEach(r=>{if(r['Campo JSON'])setPath(raw,r['Campo JSON'],parse(r.Valor))});if(raw.modulos&&!Array.isArray(raw.modulos))raw.modulos=Object.entries(raw.modulos).map(([id,v])=>({id,...v}));const formRows=XLSX.utils.sheet_to_json(workbook.Sheets['FORMULARIO'],{range:3,defval:''});const camposNegocio=[],camposFicha=[];formRows.forEach(r=>{if(!r.Clave||String(r.Activo).toLowerCase()==='no')return;const f={clave:r.Clave,etiqueta:r.Etiqueta,tipo:r.Tipo||'text',obligatorio:String(r.Obligatorio).toLowerCase()==='sí',placeholder:r.Placeholder||'',ayuda:r['Ayuda / opciones']||'',activo:true};if(r.Grupo==='Ficha')camposFicha.push(f);else camposNegocio.push({grupo:r.Grupo,...f})});const formulario={camposNegocio,camposFicha,materiales:['Logo oficial','Fotos originales identificadas','Lista de precios vigente','Manual de marca','Referencias visuales','Videos','Testimonios','Documentos legales o políticas']};download('esg-config.json',raw);setTimeout(()=>download('formulario.json',formulario),500);$('#status').innerHTML='<p class="ok">JSON generados. Reemplázalos en la carpeta data.</p>'}
</script></body></html>
